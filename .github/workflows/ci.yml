name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refuse live Stripe keys
        run: npm run check:stripe-keys
      - name: Audit
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          TURSO_DATABASE_URL: file:./data/ci.db
          NEXT_PUBLIC_SITE_URL: https://bestbotfor.com
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end
        run: npm run test:e2e
        env:
          CI: true
          TURSO_DATABASE_URL: file:./data/e2e.db
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      - name: Home page Lighthouse budget
        run: npm run check:lighthouse
        env:
          TURSO_DATABASE_URL: file:./data/ci.db
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4321
